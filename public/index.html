<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50-50 EMPIRE - Secure Arcade Network</title>
    <style>
        /* CSS थीम और कलर्स - 100% लॉक्ड */
        :root {
            --bg-main: #0d1117;
            --bg-card: #090d14;
            --bg-dark: #000000;
            --neon-cyan: #00d2ff;
            --neon-magenta: #ff0055;
            --neon-green: #56ff94;
            --neon-orange: #ff9100;
            --text-gray: #8b949e;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* सिस्टम नेविगेशन टैब्स */
        .system-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--bg-card);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-gray);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background: linear-gradient(90deg, var(--neon-magenta), #d9004c);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
        }

        .view-panel {
            display: none;
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            border: 2px solid var(--neon-cyan);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.15);
            box-sizing: border-box;
            text-align: center;
        }

        .view-panel.active { display: block; }

        /* हेडर लोगो स्टाइल */
        .brand-logo {
            width: 70px;
            height: 70px;
            margin: 0 auto 10px auto;
            border-radius: 16px;
            border: 2px solid var(--neon-orange);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(255, 145, 0, 0.2);
        }

        h2 { margin: 5px 0 20px 0; font-size: 22px; color: #fff; text-transform: uppercase; letter-spacing: 1px;}
        .sub-tag { font-size: 11px; color: var(--neon-cyan); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px;}

        /* इनपुट बॉक्स स्टाइल */
        .input-group { text-align: left; margin-bottom: 16px; }
        .input-group label { display: block; font-size: 11px; color: var(--text-gray); text-transform: uppercase; margin-bottom: 6px; letter-spacing: 1px; }
        .input-group input { width: 100%; background: var(--bg-dark); border: 1px solid #30363d; border-radius: 8px; padding: 12px; color: #fff; box-sizing: border-box; font-size: 14px; }
        .input-group input:focus { border-color: var(--neon-magenta); outline: none; }

        /* बटन स्टाइल */
        .action-btn { background: linear-gradient(90deg, var(--neon-cyan), #0088cc); color: #000; border: none; width: 100%; padding: 14px; border-radius: 10px; font-size: 13px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3); }
        .action-btn.magenta { background: linear-gradient(90deg, var(--neon-magenta), #d9004c); color: #fff; box-shadow: 0 4px 15px rgba(255, 0, 85, 0.3); }

        /* स्पिनर व्हील लेआउट */
        .wheel-container { position: relative; width: 240px; height: 240px; margin: 15px auto; border-radius: 50%; background: linear-gradient(180deg, #ffffff 50%, #1f2431 50%); border: 8px solid #282f42; box-shadow: 0 0 20px rgba(0,0,0,0.6); transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: #800020; border: 4px solid #ffd700; border-radius: 50%; z-index: 10; }

        /* इंफो ग्रिड और चिप्स */
        .info-grid { display: flex; justify-content: space-between; margin: 20px 0; font-size: 12px; }
        .balance-val { color: var(--neon-green); font-size: 18px; font-weight: bold; }
        .timer-val { color: var(--neon-orange); font-size: 18px; font-weight: bold; }
        
        .bet-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .bet-choice { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #30363d; background: #1a2233; color: #fff; font-weight: bold; cursor: pointer; }
        .bet-choice.white { background: #ffffff; color: #000; }
        .bet-choice.black { background: #000000; color: #fff; border-color: #333; }

        .chips-bar { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .chip-item { background: #161b22; border: 1px solid #30363d; padding: 8px; border-radius: 8px; font-size: 12px; cursor: pointer; width: 55px; box-sizing: border-box;}
        .chip-item.active { background: var(--neon-orange); color: #000; font-weight: bold; border-color: var(--neon-orange); }

        /* डीलर कार्ड रो */
        .dealer-row { background: var(--bg-dark); border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 12px; text-align: left; font-size: 13px; }
        .dealer-meta { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .ctrl-group { display: flex; gap: 6px; flex-wrap: wrap; }
        .sub-btn { background: #161b22; border: 1px solid #30363d; color: #fff; padding: 5px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .sub-btn.danger { border-color: var(--neon-magenta); color: var(--neon-magenta); }

        /* विनिंग पॉपअप विंडो */
        .win-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        .win-box { background: var(--bg-card); border: 3px solid var(--neon-green); border-radius: 20px; padding: 30px; text-align: center; box-shadow: 0 0 30px var(--neon-green); }
        .win-title { font-size: 28px; color: var(--neon-green); font-weight: bold; margin-bottom: 10px; text-transform: uppercase; animation: blink 1s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>

    <!-- सिस्टम नेविगेशन टैब्स -->
    <div class="system-tabs">
        <button class="tab-btn active" onclick="switchView('gateway')">Login Portal</button>
        <button class="tab-btn" onclick="switchView('master')">Master Admin</button>
        <button class="tab-btn" onclick="switchView('dealer')">Dealer Panel</button>
        <button class="tab-btn" onclick="switchView('player')">Player Arena</button>
    </div>

    <!-- 1. LOGIN GATEWAY VIEW -->
    <div id="panel-gateway" class="view-panel active">
        <div class="brand-logo"><span style="font-size:18px;color:var(--neon-magenta)">2X</span><span style="font-size:9px;color:var(--text-gray)">50-50</span></div>
        <h2>50-50 Empire</h2>
        <div class="sub-tag">Secure Entry Logic Gateway</div>
        
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="bet-choice" style="font-size:12px;" onclick="setLoginRole('player')">👤 Player</button>
            <button class="bet-choice" style="font-size:12px;" onclick="setLoginRole('dealer')">💼 Dealer</button>
            <button class="bet-choice" style="font-size:12px;" onclick="setLoginRole('master')">👑 Master</button>
        </div>

        <div id="login-fields-standard">
            <div class="input-group"><label id="login-id-label">Player Username / ID</label><input type="text" placeholder="Enter ID here..."></div>
            <div class="input-group"><label>Enter Password Key</label><input type="password" placeholder="••••••••"></div>
            <button class="action-btn magenta" onclick="alert('लॉगिन वेरिफिकेशन सफल!')">Initiate Entry</button>
        </div>

        <div id="login-fields-master" style="display:none;">
            <div class="input-group"><label>Master Admin ID</label><input type="text" placeholder="MASTER_ROOT_ADMIN"></div>
            <div class="input-group"><label>Password Key</label><input type="password" placeholder="••••••••"></div>
            <button class="action-btn magenta" onclick="triggerMasterOTP()">Send OTP</button>
            <div id="master-otp-box" style="display:none; margin-top:15px;">
                <div class="input-group" style="border-top:1px dashed #333; padding-top:15px;"><label style="color:var(--neon-green)">➜ Enter Secure 6-Digit OTP</label><input type="text" placeholder="X X X X X X" style="text-align:center; letter-spacing:5px;"></div>
                <button class="action-btn" style="background:var(--neon-green); color:#000;" onclick="switchView('master')">Verify & Enter Dashboard</button>
            </div>
        </div>
    </div>

    <!-- 2. MASTER ADMIN VIEW -->
    <div id="panel-master" class="view-panel">
        <div class="sub-tag" style="color:var(--neon-magenta); border:1px solid var(--neon-magenta); display:inline-block; padding:3px 8px; border-radius:6px;">👑 Supreme Command Center</div>
        <h2 style="margin-top:10px;">Engine Controller</h2>
        
        <!-- 4 जादुई बटन -->
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:20px;">
