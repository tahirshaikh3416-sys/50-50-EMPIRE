<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>50-50 EMPIRE - Premium 3D</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: radial-gradient(circle at center, #1f1147 0%, #050212 100%); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; overflow: hidden; }
        .game-container { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); width: 100%; max-width: 850px; display: flex; gap: 25px; border-radius: 24px; padding: 25px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 25px 60px rgba(0,0,0,0.7); align-items: center; }
        .left-panel { flex: 1.1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .game-title { font-size: 34px; font-weight: 900; background: linear-gradient(45deg, #ff0055, #00f2fe); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 15px; letter-spacing: 2px; text-shadow: 0 0 30px rgba(0,242,254,0.4); }
        .wheel-container { position: relative; width: 220px; height: 220px; margin: 10px auto; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #1f4068; background: conic-gradient(#ffffff 0deg 180deg, #111111 180deg 360deg); box-shadow: 0 15px 35px rgba(0,0,0,0.6); transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1); }
        .pointer { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #ffde7d; z-index: 11; }
        .spinning { animation: fastSpin 0.4s linear infinite; }
        @keyframes fastSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .right-panel { flex: 1.3; display: flex; flex-direction: column; justify-content: center; }
        .top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; background: rgba(255,255,255,0.06); padding: 12px 18px; border-radius: 16px; font-weight: bold; font-size: 15px; }
        .balance { color: #00ff87; } .timer { color: #ff0055; }
        .board { display: flex; justify-content: space-between; gap: 15px; margin: 15px 0; }
        .color-btn { flex: 1; height: 75px; border-radius: 16px; font-size: 18px; font-weight: 800; cursor: pointer; transition: all 0.15s; }
        .btn-white { background: linear-gradient(135deg, #fff, #d6d6d6); color: #111; border: none; box-shadow: 0 6px 0 #999; }
        .btn-white.selected { box-shadow: 0 2px 0 #999, 0 0 20px #fff; transform: translateY(4px); }
        .btn-black { background: linear-gradient(135deg, #2a2a2a, #050505); color: #fff; border: 1px solid #444; box-shadow: 0 6px 0 #000; }
        .btn-black.selected { box-shadow: 0 2px 0 #000, 0 0 20px rgba(255,255,255,0.4); transform: translateY(4px); }
        .chips-container { display: flex; justify-content: center; gap: 12px; margin: 15px 0; }
        .chip { width: 46px; height: 46px; border-radius: 50%; border: 3px dashed rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; cursor: pointer; background: linear-gradient(135deg, #ff0055, #990033); box-shadow: 0 5px 0 #660022; }
        .chip.active { background: linear-gradient(135deg, #00ff87, #60efff); color: #000; border-color: #000; box-shadow: 0 5px 0 #00aa5b; transform: translateY(-3px); }
        .action-btn { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #fff; border: none; padding: 14px; font-size: 18px; font-weight: 700; border-radius: 16px; cursor: pointer; width: 100%; box-shadow: 0 5px 0 #1d72b8; }
        .action-btn:disabled { background: #333; box-shadow: none; color: #777; cursor: not-allowed; }
        .result-box { margin-top: 15px; padding: 12px; background: rgba(0,0,0,0.4); border-radius: 16px; font-size: 20px; font-weight: 800; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .history-list { display: flex; gap: 8px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 12px; }
        .hist-dot { width: 24px; height: 24px; border-radius: 50%; }
        .hist-White { background: #fff; } .hist-Black { background: #000; border: 1px solid #333; }
    </style>
</head>
<body>
<div class="game-container">
    <div class="left-panel">
        <div class="game-title">50-50 EMPIRE</div>
        <div class="wheel-container"><div class="pointer"></div><div class="wheel" id="wheel"></div></div>
    </div>
    <div class="right-panel">
        <div class="top-bar">
            <div>आईडी: <span id="userDisplay" style="color:#00f2fe;">player1</span></div>
            <div>पॉइंट्स: <span id="balanceDisplay" class="balance">1000</span></div>
            <div>समय: <span id="timerDisplay" class="timer">01:00</span></div>
        </div>
        <div class="board">
            <button class="color-btn btn-white" onclick="selectColor('White')">सफ़ेद</button>
            <button class="color-btn btn-black" onclick="selectColor('Black')">काला</button>
        </div>
        <div class="chips-container">
            <div class="chip active" onclick="selectChip(10, this)">10</div>
            <div class="chip" onclick="selectChip(50, this)">50</div>
            <div class="chip" onclick="selectChip(100, this)">100</div>
            <div class="chip" onclick="selectChip(500, this)">500</div>
        </div>
        <div id="betStatus" style="margin-bottom: 12px; color:#a2a0c9;">रंग और कॉइन चुनें</div>
        <button class="action-btn" id="betBtn" onclick="placeBet()">दांव लॉक करें (CONFIRM)</button>
        <div class="result-box" id="resultDisplay">अगले राउंड की प्रतीक्षा...</div>
        <div class="history-list" id="historyList"></div>
    </div>
</div>
<script>
    const socket = io();
    let user = { username: "player1", points: 1000 };
    let selectedColor = null, selectedAmount = 10;
    
    function selectChip(amt, el) { selectedAmount = amt; document.querySelectorAll('.chip').forEach(c => c.classList.remove('active')); el.classList.add('active'); }
    function selectColor(col) { selectedColor = col; document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected')); if(col === 'White') document.querySelector('.btn-white').classList.add('selected'); if(col === 'Black') document.querySelector('.btn-black').classList.add('selected'); }
    function placeBet() { if(!selectedColor) return alert("रंग चुनें!"); socket.emit('place_bet', { username: user.username, color: selectedColor, amount: selectedAmount }); }

    socket.on('bet_confirmed', (data) => { user.points = data.newBalance; document.getElementById('balanceDisplay').innerText = user.points; document.getElementById('betBtn').disabled = true; });
    socket.on('timer_update', (data) => {
        let sec = data.timeLeft % 60;
        document.getElementById('timerDisplay').innerText = `00:${sec < 10 ? '0'+sec : sec}`;
        if(data.timeLeft === 5) document.getElementById('wheel').classList.add('spinning');
    });
    socket.on('draw_result', (data) => {
        let wheel = document.getElementById('wheel'); wheel.classList.remove('spinning');
        wheel.style.transform = `rotate(${(data.winningColor === 'White' ? 90 : 270) + 1440}deg)`;
        document.getElementById('resultDisplay').innerText = `विजेता: ${data.winningColor === 'White' ? '⚪ सफ़ेद' : '⚫ काला'}`;
        let hList = document.getElementById('historyList'); hList.innerHTML = "";
        data.history.forEach(h => { hList.innerHTML += `<span class="hist-dot hist-${h}"></span>`; });
        setTimeout(() => { document.getElementById('betBtn').disabled = false; }, 3000);
    });
</script>
</body>
</html>
